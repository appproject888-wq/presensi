<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presensi Wajah</title>
<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e5e9f2;
  --accent:#2563eb;
  --accent-2:#1d4ed8;
  --ok:#15803d;   --ok-bg:#dcfce7;
  --warn:#b45309; --warn-bg:#fef3c7;
  --bad:#b91c1c;  --bad-bg:#fee2e2;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --card:#121a2e; --text:#e6ebf5; --muted:#8b97b0; --line:#1f2a44;
    --accent:#3b82f6; --accent-2:#2563eb;
    --ok:#4ade80; --ok-bg:#12301f;
    --warn:#fbbf24; --warn-bg:#33270e;
    --bad:#f87171; --bad-bg:#3a1717;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --card:#121a2e; --text:#e6ebf5; --muted:#8b97b0; --line:#1f2a44;
  --accent:#3b82f6; --accent-2:#2563eb;
  --ok:#4ade80; --ok-bg:#12301f;
  --warn:#fbbf24; --warn-bg:#33270e;
  --bad:#f87171; --bad-bg:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}

/* ===== header ===== */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem}
h1{font-size:1.1rem;margin:0;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ===== kartu ===== */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:800px){.grid{grid-template-columns:1.3fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;font-weight:600}
h2:first-child{margin-top:0}

/* ===== kamera ===== */
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#0a0f1a;border-radius:12px;overflow:hidden}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
.stage canvas{pointer-events:none}

/* ===== tombol & input ===== */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{
  font:inherit;font-weight:600;min-height:42px;padding:10px 16px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--text);transition:background .15s ease;
}
button:hover:not(:disabled){background:var(--bg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:var(--accent-2)}
button:disabled{opacity:.5;cursor:default}
input{
  font:inherit;width:100%;padding:10px 12px;margin-top:8px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
#daftarBox{margin-top:14px}
#daftarBox[hidden]{display:none}
#msg{color:var(--muted);margin:14px 0 0}

/* ===== hasil ===== */
#hasil{display:flex;flex-direction:column;gap:0}
.big-msg{padding:18px;border-radius:12px;background:var(--bg)}
.big-msg .t{font-size:1.15rem;font-weight:700}
.big-msg .s{color:var(--muted);font-size:.9rem;margin-top:4px}
.big-msg.ok .t{color:var(--ok)}
.big-msg.warn .t{color:var(--warn)}
.big-msg.bad .t{color:var(--bad)}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);margin-bottom:8px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;background:var(--accent);color:#fff;flex:none}
.av.ok{background:var(--ok-bg);color:var(--ok)}
.av.warn{background:var(--warn-bg);color:var(--warn)}
.av.bad{background:var(--bad-bg);color:var(--bad)}
.info{flex:1;min-width:0}
.nama{font-weight:700;overflow-wrap:anywhere}
.detail{font-size:.85rem;color:var(--muted)}
.tag{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}

/* ===== status & log ===== */
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
dt{color:var(--muted)}
dd{margin:0;font-weight:600;overflow-wrap:anywhere}
ul{padding:0;list-style:none;max-height:220px;overflow:auto;margin:0;font-size:.82rem;color:var(--muted)}
li{padding:6px 0;border-bottom:1px solid var(--line)}

@media (max-width:480px){
  h1{font-size:1rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <h1>Presensi Wajah</h1>
        <p class="sub">Absensi dengan pengenalan wajah</p>
      </div>
    </div>
    <span class="chip"><i></i>Aktif</span>
  </header>

  <div class="grid">
    <section class="card">
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="controls">
        <button id="btnStart" class="primary">Mulai</button>
        <button id="btnMode" disabled>Mode: Presensi</button>
      </div>
      <div id="daftarBox" hidden>
        <input id="inID" placeholder="ID pegawai (contoh P001)" autocomplete="off">
        <input id="inNama" placeholder="Nama lengkap" autocomplete="off">
        <input id="inPin" type="password" placeholder="PIN admin" autocomplete="off">
        <div class="controls"><button id="btnDaftar">Ambil 5 foto lalu simpan</button></div>
      </div>
      <p id="msg">Tekan Mulai, lalu izinkan kamera.</p>
    </section>

    <section class="card">
      <h2>Hasil</h2>
      <div id="hasil"><div class="big-msg"><div class="t">Menunggu wajah...</div></div></div>

      <h2>Status</h2>
      <dl>
        <dt>Kamera</dt><dd id="sCam">belum aktif</dd>
        <dt>Model AI</dt><dd id="sModel">belum dimuat</dd>
        <dt>Server</dt><dd id="sServer">-</dd>
      </dl>

      <h2>Log</h2>
      <ul id="log"></ul>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
(function () {
  'use strict';

  // ====== PENGATURAN: ganti dua baris ini ======
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzo5Po5nhRycJu3B3xXVGRpLt-mAXW9WE9LtIFGVi8PA1TB2mlrFTS0PCzhnD2UJa0U7Q/exec';  // URL yang berakhiran /exec
  const API_TOKEN = 'rahasia-kantor-2026';          // harus sama dengan API_TOKEN di Apps Script
  // =============================================

  const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
  const SCAN_GAP_MS = 2500;   // jeda minimal antar kiriman ke server
  const MAKS_WAJAH = 10;      // batas wajah yang dikirim sekali jalan
  const ENROLL_SAMPLES = 5;
  const ENROLL_GAP_MS = 500;
  const DETECT_SIZE = 320;
  const SPEAK_REPEAT_MS = 15000; // kalimat yang sama tidak diulang dalam 15 detik
  const HASIL_RESET_MS = 4000;   // setelah wajah hilang, daftar hasil dikosongkan

  // ----- pengaturan liveness (anti foto) -----
  const LIVE_WINDOW_MS = 2500;   // rentang waktu yang dilihat untuk gerakan/kedipan
  const LIVE_HOLD_MS = 4000;     // setelah terbukti hidup, status bertahan selama ini
  const MOVE_MIN = 0.03;         // gerakan hidung minimal (dibagi lebar wajah)
  const EAR_TUTUP = 0.21;        // mata dianggap tertutup di bawah nilai ini
  const EAR_BUKA = 0.26;         // mata dianggap terbuka lagi di atas nilai ini

  const $ = (id) => document.getElementById(id);
  const video = $('video');
  const canvas = $('overlay');
  const ctx = canvas.getContext('2d');

  let running = false;
  let modelsReady = false;
  let mode = 'presensi';   // 'presensi' | 'daftar'
  let busy = false;
  let lastSend = 0;
  let enroll = null;       // { samples, lastT, id, nama, pin }
  let lastSpoken = { text: '', t: 0 };
  let hasilIsi = false;    // apakah kotak hasil sedang berisi daftar nama
  let hasilT = 0;          // kapan terakhir kotak hasil diisi
  let lastKey = '';        // untuk mencegah tampilan status diulang terus
  let tracks = [];         // wajah yang sedang dilacak antar frame
  let trackSeq = 0;

  function log(text) {
    const li = document.createElement('li');
    li.textContent = new Date().toLocaleTimeString('id-ID') + '  ' + text;
    const list = $('log');
    list.prepend(li);
    while (list.children.length > 50) list.lastChild.remove();
  }

  function setMsg(text) { $('msg').textContent = text; }

  // kotak besar untuk pesan status
  function setHasil(teks, kelas, sub) {
    const h = $('hasil');
    h.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'big-msg ' + (kelas || '');
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = teks;
    box.appendChild(t);
    if (sub) {
      const s = document.createElement('div');
      s.className = 's';
      s.textContent = sub;
      box.appendChild(s);
    }
    h.appendChild(box);
    hasilIsi = false;
  }

  function setOnce(key, fn) {
    if (key === lastKey) return;
    lastKey = key;
    fn();
  }

  function inisial(nama) {
    return String(nama || '').split(/\s+/).filter(Boolean).slice(0, 2)
      .map(function (s) { return s.charAt(0); }).join('').toUpperCase() || '?';
  }

  function buatItem(t) {
    const div = document.createElement('div');
    div.className = 'item';
    const av = document.createElement('div');
    av.className = 'av ' + t.kelas;
    av.textContent = t.inisial;
    const info = document.createElement('div');
    info.className = 'info';
    const nama = document.createElement('div');
    nama.className = 'nama';
    nama.textContent = t.nama;
    info.appendChild(nama);
    if (t.sub) {
      const d = document.createElement('div');
      d.className = 'detail';
      d.textContent = t.sub;
      info.appendChild(d);
    }
    const tag = document.createElement('span');
    tag.className = 'tag ' + t.kelas;
    tag.textContent = t.tag;
    div.appendChild(av);
    div.appendChild(info);
    div.appendChild(tag);
    return div;
  }

  function bicara(text, paksa) {
    try {
      if (!('speechSynthesis' in window)) return;
      const now = Date.now();
      if (!paksa && text === lastSpoken.text && now - lastSpoken.t < SPEAK_REPEAT_MS) return;
      lastSpoken = { text: text, t: now };
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'id-ID';
      u.rate = 0.95;
      const voice = speechSynthesis.getVoices().find(function (v) {
        return v.lang && v.lang.toLowerCase().indexOf('id') === 0;
      });
      if (voice) u.voice = voice;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {
      log('Suara gagal: ' + e.message);
    }
  }

  function explainCameraError(e) {
    const map = {
      NotAllowedError: 'Izin kamera ditolak. Buka pengaturan situs di browser lalu izinkan kamera.',
      NotFoundError: 'Tidak ada kamera yang terdeteksi.',
      NotReadableError: 'Kamera sedang dipakai aplikasi lain.',
      OverconstrainedError: 'Resolusi kamera tidak didukung.',
      SecurityError: 'Diblokir keamanan browser (halaman harus HTTPS).'
    };
    return (map[e.name] || 'Gagal membuka kamera') + ' [' + e.name + ']';
  }

  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Kamera tidak tersedia. Halaman harus dibuka lewat HTTPS.');
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
    } catch (e) {
      throw new Error(explainCameraError(e));
    }
    video.srcObject = stream;
    await video.play();
  }

  async function loadModels() {
    if (!window.faceapi) throw new Error('Library face-api.js gagal dimuat. Cek koneksi internet.');
    $('sModel').textContent = 'memuat...';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    modelsReady = true;
    $('sModel').textContent = 'siap';
    log('Model AI dimuat');
  }

  async function keepScreenAwake() {
    try {
      await navigator.wakeLock.request('screen');
      log('Layar dibuat tetap menyala');
    } catch (_) {
      log('Wake Lock tidak tersedia');
    }
  }

  // kirim data ke Apps Script; text/plain agar tidak kena pemeriksaan CORS yang rumit
  async function kirim(payload) {
    payload.token = API_TOKEN;
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  // ===== liveness: cek apakah wajah milik orang hidup =====
  function jarakTitik(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  // Eye Aspect Ratio: kecil = mata tertutup
  function ear(p) {
    return (jarakTitik(p[1], p[5]) + jarakTitik(p[2], p[4])) / (2 * jarakTitik(p[0], p[3]));
  }

  // lacak wajah antar frame dan perbarui riwayat gerakan & kedipannya
  function lacakWajah(faces, now) {
    const dipakai = new Set();
    faces.forEach(function (f) {
      const b = f.detection.box;
      const cx = b.x + b.width / 2;
      const cy = b.y + b.height / 2;

      let t = null;
      let dMin = Infinity;
      tracks.forEach(function (k) {
        if (dipakai.has(k)) return;
        const d = Math.hypot(k.cx - cx, k.cy - cy);
        if (d < 0.5 * Math.max(b.width, b.height) && d < dMin) { t = k; dMin = d; }
      });
      if (!t) {
        t = { id: ++trackSeq, hist: [], liveUntil: 0, cx: cx, cy: cy, w: b.width, lastT: now };
        tracks.push(t);
      }
      dipakai.add(t);
      t.cx = cx; t.cy = cy; t.w = b.width; t.lastT = now;

      const hidung = f.landmarks.getNose()[3];
      const mataKiri = f.landmarks.getLeftEye();
      const mataKanan = f.landmarks.getRightEye();
      t.hist.push({
        t: now,
        nx: (hidung.x - b.x) / b.width,
        ny: (hidung.y - b.y) / b.width,
        ear: (ear(mataKiri) + ear(mataKanan)) / 2
      });
      t.hist = t.hist.filter(function (h) { return now - h.t <= LIVE_WINDOW_MS; });
      cekLive(t, now);
      f._track = t;
    });
    tracks = tracks.filter(function (k) { return now - k.lastT <= 1000; });
  }

  function cekLive(t, now) {
    const h = t.hist;
    if (h.length < 4) return;

    // 1) gerakan kepala: foto diam tidak bergerak
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of h) {
      if (p.nx < minX) minX = p.nx;
      if (p.nx > maxX) maxX = p.nx;
      if (p.ny < minY) minY = p.ny;
      if (p.ny > maxY) maxY = p.ny;
    }
    if (Math.max(maxX - minX, maxY - minY) >= MOVE_MIN) {
      t.liveUntil = now + LIVE_HOLD_MS;
    }

    // 2) kedipan: mata tertutup lalu terbuka lagi
    let tertutup = false;
    for (const p of h) {
      if (!tertutup) {
        if (p.ear < EAR_TUTUP) tertutup = true;
      } else if (p.ear > EAR_BUKA) {
        t.liveUntil = now + LIVE_HOLD_MS;
        break;
      }
    }
  }

  function sudahHidup(f, now) {
    return !!(f._track && f._track.liveUntil > now);
  }

  // ubah satu hasil dari server menjadi data tampilan
  function tafsirItem(r) {
    const pct = (r.kecocokan != null) ? 'kecocokan ' + r.kecocokan.toFixed(1) + '%' : '';
    switch (r.status) {
      case 'masuk':
        return { nama: r.nama, inisial: inisial(r.nama), tag: 'Masuk', kelas: 'ok',
                 sub: 'Jam ' + r.jam + ' · ' + pct, suara: r.nama + ' hadir', log: 'Masuk: ' + r.nama };
      case 'pulang':
        return { nama: r.nama, inisial: inisial(r.nama), tag: 'Pulang', kelas: 'ok',
                 sub: 'Jam ' + r.jam + ' · ' + pct, suara: r.nama + ' pulang', log: 'Pulang: ' + r.nama };
      case 'cooldown':
        return { nama: r.nama, inisial: inisial(r.nama), tag: 'Sudah tercatat', kelas: 'warn',
                 sub: pct, suara: r.nama + ' sudah tercatat', log: null };
      default:
        return null;
    }
  }

  function tampilkanBanyak(r) {
    $('sServer').textContent = 'terhubung';
    if (!r.ok) {
      setHasil('Gagal', 'bad', r.error || '');
      log('ERROR: ' + (r.error || 'tidak diketahui'));
      return;
    }

    const daftar = r.hasil || [];
    if (daftar.length && daftar[0].status === 'kosong') {
      setHasil('Belum ada pegawai terdaftar', 'warn');
      bicara('Belum ada pegawai terdaftar');
      return;
    }

    const h = $('hasil');
    h.innerHTML = '';
    const suara = [];
    let belumTerdaftar = 0;

    daftar.forEach(function (item) {
      if (item.status === 'tidak_dikenali') { belumTerdaftar++; return; }
      if (item.status === 'error') { log('ERROR: ' + (item.error || '')); return; }
      const t = tafsirItem(item);
      if (!t) return;
      h.appendChild(buatItem(t));
      if (t.suara) suara.push(t.suara);
      if (t.log) log(t.log);
    });

    if (belumTerdaftar > 0) {
      h.appendChild(buatItem({
        nama: 'Belum terdaftar',
        inisial: '?',
        tag: 'Tidak dikenal',
        kelas: 'bad',
        sub: belumTerdaftar > 1 ? belumTerdaftar + ' wajah' : ''
      }));
      suara.push('Belum terdaftar');
      log('Belum terdaftar: ' + belumTerdaftar + ' wajah');
    }

    if (h.children.length === 0) {
      setHasil('Menunggu wajah...');
    } else {
      hasilIsi = true;
      hasilT = Date.now();
    }
    lastKey = '';
    if (suara.length) bicara(suara.join('. '));
  }

  function tampilkanDaftar(r) {
    if (!r.ok) {
      setMsg('Gagal: ' + r.error);
      log('Daftar gagal: ' + r.error);
      bicara('Pendaftaran gagal', true);
      return;
    }
    const kalimat = r.nama + (r.status === 'baru' ? ' berhasil didaftarkan' : ' datanya diperbarui');
    setMsg(kalimat);
    log('Daftar: ' + r.nama + ' (' + r.status + ')');
    bicara(kalimat, true);
  }

  function handleEnroll(faces) {
    if (!enroll) return;
    if (faces.length === 0) { setMsg('Wajah belum terdeteksi.'); return; }
    if (faces.length > 1) { setMsg('Harus tepat 1 wajah di kamera.'); return; }

    const f = faces[0];
    const now = performance.now();
    if (f.detection.score < 0.7 || now - enroll.lastT < ENROLL_GAP_MS) return;

    enroll.samples.push(f.descriptor);
    enroll.lastT = now;
    setMsg('Sampel ' + enroll.samples.length + '/' + ENROLL_SAMPLES);
    if (enroll.samples.length < ENROLL_SAMPLES) return;

    const avg = new Float32Array(128);
    for (const s of enroll.samples) {
      for (let i = 0; i < 128; i++) avg[i] += s[i] / ENROLL_SAMPLES;
    }
    const data = { action: 'enroll', id: enroll.id, nama: enroll.nama, pin: enroll.pin, vec: Array.from(avg) };
    enroll = null;
    setMsg('Menyimpan ke server...');
    kirim(data)
      .then(tampilkanDaftar)
      .catch(function (err) {
        setMsg('Gagal kirim: ' + err.message);
        log('ERROR: ' + err.message);
      })
      .finally(function () { $('btnDaftar').disabled = false; });
  }

  function draw(faces, now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 3;
    for (const f of faces) {
      const b = f.detection.box;
      const hidup = sudahHidup(f, now);
      ctx.strokeStyle = hidup ? '#22c55e' : '#f59e0b';
      ctx.setLineDash(hidup ? [] : [8, 6]);
      ctx.strokeRect(b.x, b.y, b.width, b.height);
    }
    ctx.setLineDash([]);
  }

  $('btnMode').addEventListener('click', function () {
    mode = mode === 'presensi' ? 'daftar' : 'presensi';
    $('btnMode').textContent = 'Mode: ' + (mode === 'presensi' ? 'Presensi' : 'Daftar');
    $('daftarBox').hidden = mode !== 'daftar';
    enroll = null;
    $('btnDaftar').disabled = false;
    lastKey = '';
    if (mode === 'presensi') {
      setHasil('Menunggu wajah...');
      setMsg('Hadapkan wajah ke kamera.');
    } else {
      setHasil('Mode daftar');
      setMsg('Isi ID, nama, dan PIN, lalu tekan tombol.');
    }
  });

  $('btnDaftar').addEventListener('click', function () {
    const id = $('inID').value.trim();
    const nama = $('inNama').value.trim();
    const pin = $('inPin').value.trim();
    if (!id || !nama || !pin) {
      setMsg('ID, nama, dan PIN wajib diisi.');
      return;
    }
    enroll = { samples: [], lastT: 0, id: id, nama: nama, pin: pin };
    $('btnDaftar').disabled = true;
    setMsg('Pandangi kamera dan gerakkan kepala sedikit...');
    log('Mulai daftar: ' + nama);
  });

  $('btnStart').addEventListener('click', async function () {
    if (APPS_SCRIPT_URL.indexOf('GANTI') === 0 || API_TOKEN.indexOf('GANTI') === 0) {
      setMsg('Isi APPS_SCRIPT_URL dan API_TOKEN di dalam file dulu.');
      return;
    }
    $('btnStart').disabled = true;
    try {
      setMsg('Membuka kamera...');
      await startCamera();
      $('sCam').textContent = 'aktif (' + video.videoWidth + '×' + video.videoHeight + ')';
      log('Kamera aktif');
      if (!modelsReady) await loadModels();
      keepScreenAwake();
      bicara('Presensi siap', true); // sekaligus mengaktifkan suara
      running = true;
      $('btnMode').disabled = false;
      $('btnStart').textContent = 'Berjalan';
      setMsg('Hadapkan wajah ke kamera.');
      requestAnimationFrame(loop);
    } catch (e) {
      $('btnStart').disabled = false;
      $('sCam').textContent = 'gagal';
      setMsg(e.message);
      log('ERROR: ' + e.message);
    }
  });

  async function loop() {
    if (!running) return;
    try {
      if (video.readyState >= 2 && modelsReady) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        const faces = await faceapi
          .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: DETECT_SIZE, scoreThreshold: 0.5 }))
          .withFaceLandmarks()
          .withFaceDescriptors();
        const now = Date.now();
        lacakWajah(faces, now);
        draw(faces, now);

        if (mode === 'daftar') {
          handleEnroll(faces);
        } else {
          const bagus = faces.filter(function (f) { return f.detection.score >= 0.7; });
          const siap = bagus.filter(function (f) { return sudahHidup(f, now); });
          const belumHidup = bagus.filter(function (f) { return !sudahHidup(f, now); });

          if (siap.length > 0 && !busy && now - lastSend >= SCAN_GAP_MS) {
            busy = true;
            lastSend = now;
            const vecs = siap.slice(0, MAKS_WAJAH).map(function (f) { return Array.from(f.descriptor); });
            kirim({ action: 'attend', vecs: vecs })
              .then(tampilkanBanyak)
              .catch(function (err) {
                $('sServer').textContent = 'gagal';
                setHasil('Gagal terhubung', 'bad', err.message);
                log('ERROR: ' + err.message);
              })
              .finally(function () { busy = false; });
          } else if (siap.length === 0 && belumHidup.length > 0) {
            setOnce('verifikasi', function () {
              setHasil('Verifikasi diperlukan', 'warn', 'Gerakkan kepala sedikit atau kedipkan mata');
            });
          } else if (faces.length === 0 && hasilIsi && now - hasilT > HASIL_RESET_MS) {
            setHasil('Menunggu wajah...');
            lastKey = '';
          }
        }
      }
    } catch (e) {
      log('ERROR deteksi: ' + e.message);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
